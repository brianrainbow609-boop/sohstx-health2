<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tire Shop Rivals</title>
  <link rel="stylesheet" href="/games/shared/controls.css">
  <link rel="stylesheet" href="./rivals.css?v=20261125">
  <script src="/games/shared/legacy-storage.js"></script>
  <script type="module" src="./rivals.mjs?v=20261125b"></script>
</head>
<body>
  <main>
    <p><a href="/games/">← Game Hub</a></p>
    <h1>Tire Shop Rivals</h1>
    <section aria-label="Match">
      <div id="score"></div>
      <div class="arena">
        <div class="fighter">
          <strong id="mine"></strong>
          <progress id="hp" max="100" value="100" aria-label="Your health"></progress>
          <canvas id="myface" width="160" height="150" aria-hidden="true"></canvas>
        </div>
        <span class="vs" aria-hidden="true">VS</span>
        <div class="fighter">
          <strong id="theirs"></strong>
          <progress id="ehp" max="100" value="100" aria-label="Opponent health"></progress>
          <canvas id="theirface" width="160" height="150" aria-hidden="true"></canvas>
        </div>
      </div>
      <p id="message" role="status">Loading fighters…</p>
      <button id="retry" type="button" hidden>Retry loading fighters</button>
      <div class="actions">
        <button id="punch" type="button" disabled>Punch</button>
        <button id="auto" type="button" aria-pressed="false" disabled>Auto: Off</button>
        <button id="next" type="button" disabled>Next Round</button>
        <button id="reset" type="button" disabled>Reset Progress</button>
      </div>
    </section>
    <section aria-labelledby="roster-heading">
      <h2 id="roster-heading">Choose your fighter</h2>
      <div class="fields">
        <label>Find a fighter <input id="search" type="search" placeholder="Name, type, or monster" disabled></label>
        <label>Opponent <select id="enemy" disabled></select></label>
      </div>
      <div id="roster" class="roster"></div>
      <p id="empty" hidden>No fighters match your search.</p>
    </section>
    <section aria-labelledby="upgrade-heading">
      <h2 id="upgrade-heading">Upgrade your fighter</h2>
      <div id="stats" class="stats"></div>
      <small>Earn 2 points per hit and 15 bonus points per knockout. Progress saves on this device.</small>
    </section>
  </main>
</body>
</html>
