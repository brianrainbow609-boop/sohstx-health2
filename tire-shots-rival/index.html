<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tire Shots Rival</title><style>*{box-sizing:border-box}body{background:#111827;color:#f7f8fa;font:16px system-ui;margin:0}main{max-width:850px;margin:auto;padding:18px}h1{color:#ffcc49}section{background:#202b3f;padding:16px;margin:12px 0;border-radius:14px}button,select{background:#f6c84d;color:#111827;border:0;border-radius:9px;padding:12px;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.roster{display:flex;overflow:auto;gap:9px}.card{min-width:106px;background:#34425d;color:white;border:2px solid transparent}.selected{border-color:#f6c84d}.face{font-size:45px;display:block}.arena{display:flex;align-items:center;justify-content:space-around;background:linear-gradient(#3a4a67 65%,#765746 65%);min-height:220px;border-radius:12px}.fighter{text-align:center;flex:1}.fighter .face{font-size:70px}.bar{height:12px;background:#69303c;margin:9px;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#5cdb8b}.vs{color:#f6c84d;font-weight:900;font-size:25px}.actions,.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.stats{grid-template-columns:repeat(3,1fr)}.stats button{width:100%;font-size:12px}.stat{text-align:center;background:#33415a;border-radius:8px;padding:9px}#message{color:#f6c84d;min-height:25px;font-weight:bold}a{color:#f6c84d}</style></head><body><main><p><a href="/games/">← Game Hub</a></p><h1>🥊 TIRE SHOTS RIVAL</h1><p>Choose your fighter, challenge a rival, earn points by punching and upgrade your skills!</p><section><h3>CHOOSE YOUR FIGHTER</h3><div id="roster" class="roster"></div><p>Opponent: <select id="enemy"></select></p></section><section><div id="score"></div><div class="arena"><div class="fighter"><strong id="mine"></strong><div class="bar"><i id="hp"></i></div><span class="face" id="myface">🥊</span></div><div class="vs">VS</div><div class="fighter"><strong id="theirs"></strong><div class="bar"><i id="ehp"></i></div><span class="face" id="theirface">🥊</span></div></div><p id="message">Ready to rumble!</p><div class="actions"><button id="punch">👊 PUNCH</button><button id="auto">▶ AUTO: OFF</button><button id="next">NEXT ROUND</button><button id="reset">RESET</button></div></section><section><h3>UPGRADE YOUR FIGHTER</h3><div id="stats" class="stats"></div><small>Earn 2 points per hit and 15 bonus points per knockout. Progress saves on this device.</small></section></main><script>
const names=['Hector','Erasmo',...Array.from({length:16},(_,i)=>'Fighter '+(i+1))],faces=['🧢','🧔',...Array.from({length:16},(_,i)=>['👨','👷','🥷','🧑‍🔧','👨‍🔧'][i%5])];let s;try{s=JSON.parse(localStorage.getItem('tireShotsRival'))}catch{}s={me:0,enemy:1,points:0,wins:0,round:1,strength:1,speed:1,accuracy:1,...s};let hp=100,ehp=100,over=false,autoTimer=null,last=0;const $=x=>document.getElementById(x);function save(){localStorage.setItem('tireShotsRival',JSON.stringify(s))}function render(){const r=$('roster');r.innerHTML='';names.forEach((n,i)=>{let b=document.createElement('button');b.className='card '+(i===s.me?'selected':'');b.innerHTML='<span class="face">'+faces[i]+'</span>'+n;b.onclick=()=>{s.me=i;if(s.enemy===i)s.enemy=(i+1)%names.length;next()};r.append(b)});const sel=$('enemy');sel.innerHTML='';names.forEach((n,i)=>{if(i!==s.me){let o=document.createElement('option');o.value=i;o.textContent=n;sel.append(o)}});sel.value=s.enemy;$('mine').textContent=names[s.me];$('theirs').textContent=names[s.enemy];$('myface').textContent=faces[s.me];$('theirface').textContent=faces[s.enemy];$('hp').style.width=Math.max(0,hp)+'%';$('ehp').style.width=Math.max(0,ehp)+'%';$('score').textContent='Round '+s.round+' | Wins '+s.wins+' | Points '+s.points;$('punch').disabled=over;$('stats').innerHTML='';for(const k of ['strength','speed','accuracy']){let d=document.createElement('div');d.className='stat';let t=document.createElement('div');t.textContent=k.toUpperCase()+' Lv '+s[k];let b=document.createElement('button'),cost=s[k]*5;b.textContent='UPGRADE '+cost+' pts';b.disabled=s.points<cost;b.onclick=()=>{s.points-=cost;s[k]++;render()};d.append(t,b);$('stats').append(d)}save()}function stop(){clearInterval(autoTimer);autoTimer=null;$('auto').textContent='▶ AUTO: OFF'}function next(){stop();hp=100;ehp=100;over=false;last=0;s.round++;$('message').textContent='New round!';render()}function hit(){if(over||Date.now()-last<Math.max(120,700-s.speed*55))return;last=Date.now();if(Math.random()<Math.min(.98,.58+s.accuracy*.05)){let damage=5+s.strength*2+Math.floor(Math.random()*5);ehp-=damage;s.points+=2;$('message').textContent=names[s.me]+' hits for '+damage+'! +2 points'}else $('message').textContent='Miss! Upgrade accuracy.';if(ehp<=0){ehp=0;s.wins++;s.points+=15;over=true;stop();$('message').textContent='KNOCKOUT! +15 bonus points!'}else if(Math.random()<.6){hp-=3+Math.floor(Math.random()*7);if(hp<=0){hp=0;over=true;stop();$('message').textContent='You were knocked out! Try again.'}}render()}$('punch').onclick=hit;$('next').onclick=next;$('enemy').onchange=e=>{s.enemy=+e.target.value;next()};$('auto').onclick=()=>{if(autoTimer){stop();return}if(over)next();autoTimer=setInterval(hit,110);$('auto').textContent='⏸ AUTO: ON'};$('reset').onclick=()=>{if(confirm('Reset progress?')){localStorage.removeItem('tireShotsRival');location.reload()}};document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['BUTTON','SELECT','INPUT'].includes(document.activeElement.tagName)){e.preventDefault();hit()}});render();
</script></body></html>
