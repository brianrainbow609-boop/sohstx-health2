<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SuperETX Efficiency Tracker</title><style>body{background:#03070c;color:#eaf1f5;font:16px system-ui;max-width:650px;margin:auto;padding:24px}a{color:#35d5ff}section{border:1px solid #3e849c;border-radius:12px;padding:16px;margin:12px 0}button{background:#102b39;color:white;border:1px solid #35d5ff;padding:12px;border-radius:8px}strong{font-size:24px}</style><a href="/superetx/">Back to packages</a><h1>Efficiency tracker</h1><p>Manual counters stored in this browser only. These are workflow metrics, not actual Work credit usage.</p><main></main><button id="export">Export metrics</button><script>const labels=['Completed tasks','Reused workflows','Repeated operations avoided','Work escalations'];let counts=[0,0,0,0];try{const saved=JSON.parse(localStorage.getItem('superetx.metrics.v1'));if(Array.isArray(saved)&&saved.length===4&&saved.every(n=>Number.isSafeInteger(n)&&n>=0))counts=saved}catch{}function render(){document.querySelector('main').replaceChildren();labels.forEach((label,i)=>{const s=document.createElement('section');const h=document.createElement('h2');h.textContent=label;const n=document.createElement('strong');n.textContent=counts[i];s.append(h,n,document.createTextNode(' '));for(const delta of [1,-1]){const b=document.createElement('button');b.textContent=delta===1?'+1':'−1';b.onclick=()=>{counts[i]=Math.max(0,counts[i]+delta);try{localStorage.setItem('superetx.metrics.v1',JSON.stringify(counts))}catch{}render()};s.append(b,document.createTextNode(' '))}document.querySelector('main').append(s)})}document.querySelector('#export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(Object.fromEntries(labels.map((l,i)=>[l,counts[i]])),null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='superetx-metrics.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};render()</script></html>
