name: Game checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  games:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node games/shared/game-kit.test.mjs
      - run: node games/shared/catalog.test.mjs
      - run: node games/shared/game-qa.mjs
