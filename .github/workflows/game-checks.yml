name: Game checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  games:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node games/shared/game-kit.test.mjs
      - run: node games/shared/catalog.test.mjs
      - name: Run pool hall and rivals unit tests
        run: node --test games/hectors-pool-hall/*.test.mjs tire-shots-rival/combat.test.mjs
      - run: node games/shared/game-qa.mjs
      - run: npm install --no-save playwright
      - run: npx playwright install chromium
      - name: Run browser smoke tests
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/sohstx-game-qa-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:4173/games/catalog.json > /dev/null; then break; fi
            sleep 0.25
          done
          node games/shared/browser-smoke.mjs
          node games/shared/game-interaction.mjs
      - name: Upload game screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sohstx-game-browser-screenshots
          path: |
            artifacts/game-screenshots/
            artifacts/game-interaction-report.json
          if-no-files-found: ignore
