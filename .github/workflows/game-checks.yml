name: Game checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  games:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node games/shared/game-kit.test.mjs
      - run: node games/shared/catalog.test.mjs
      - run: node games/shared/game-qa.mjs
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/sohstx-game-qa-server.log 2>&1 &
      - run: node games/shared/browser-smoke.mjs
