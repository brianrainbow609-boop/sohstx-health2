const X=430,Y=69,W=39,H=19;function pos(i){let [x,y]=xy(i);return [X+(x-y)*W,Y+(x+y)*H]}function poly(points,color,stroke){ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fillStyle=color;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function tile(x,y,w,h,c,edge){poly([[x,y-h],[x+w,y],[x,y+h],[x-w,y]],c,edge)}
function box(x,y,w,h,z,roof,left,right){poly([[x-w,y-h],[x,y],[x,y-z],[x-w,y-h-z]],left);poly([[x,y],[x+w,y-h],[x+w,y-h-z],[x,y-z]],right);tile(x,y-h-z,w,h,roof)}

function sprite(k,x,y,h,frame=0,dir=1){let im=images[k];if(!im?.naturalWidth)return;let multi=['hero','demon','blue','tech','knight'].includes(k),w=im.width/(multi?4:1),dw=h*w/im.height;ctx.save();ctx.translate(x,y);ctx.scale(dir,1);ctx.imageSmoothingEnabled=false;ctx.drawImage(im,multi?(frame%4)*w:0,0,w,im.height,-dw/2,-h,dw,h);ctx.restore()}
