<script>
'use strict';
const $=s=>document.querySelector(s), canvas=$('canvas'),g=canvas.getContext('2d'),art=$('#art');
const W=576,H=240,floor=205,end=2880;
const ledges=[[242,164,104],[417,137,96],[776,166,124],[1120,159,102],[1400,170,142],[1730,158,120],[1955,133,102],[2310,166,144]];
const pits=[[640,698],[1620,1680],[2180,2242]];
let mode='ready',p,enemies,bolts,sparks,cam,tick,checkpoint,score,toast,inv,fireWait,jumpQueued=false;
const held=new Map(), down=k=>Array.from(held.values()).includes(k);
function reset(){p={x:55,y:floor,v:0,face:1,ground:true,hp:3};enemies=[340,565,824,1030,1240,1535,1810,2070,2380,2535,2780].map((x,i)=>({x,base:x,y:floor,r:i===10?29:13,hp:i===10?22:2,boss:i===10,phase:i,shot:95+i*5,flash:0}));bolts=[];sparks=[];tick=cam=score=checkpoint=toast=inv=fireWait=0;clearInput()}
function clearInput(){held.clear();jumpQueued=false;document.querySelectorAll('.held').forEach(b=>b.classList.remove('held'))}
function screen(state,title,note,button){mode=state;clearInput();$('#panel').hidden=false;$('#title').textContent=title;$('#note').textContent=note;$('#start').textContent=button;$('#tag').textContent=state==='paused'?'SHIFT ON HOLD':'SOHSTX ARCADE · STAGE 01'}
function play(){if(mode!=='paused')reset();mode='play';$('#panel').hidden=true}
function pause(){if(mode==='play')screen('paused','BREAK TIME','Your shift is paused.','Resume ▶');else if(mode==='paused')play()}
$('#start').onclick=play;$('#pause').onclick=pause;
function press(id,k){if(mode!=='play'||held.has(id))return;if(k==='jump')jumpQueued=true;held.set(id,k)}
const keys={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',ArrowUp:'jump',KeyX:'fire'};
onkeydown=e=>{if(keys[e.code]&&mode==='play'){e.preventDefault();press(e.code,keys[e.code])}if(!e.repeat&&['KeyP','Escape'].includes(e.code))pause()};onkeyup=e=>held.delete(e.code);
document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);press(e.pointerId,b.dataset.key);b.classList.add('held')};b.onlostpointercapture=e=>{held.delete(e.pointerId);b.classList.remove('held')}});
onblur=()=>{if(mode==='play')pause()};document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')pause()});
function burst(x,y){for(let i=0;i<9;i++)sparks.push({x,y,vx:Math.cos(i*2)*2.5,vy:-2+Math.sin(i)*2,life:18})}
function hit(fall=false){if(inv&&!fall)return;p.hp--;if(!p.hp){screen('lost','SHIFT OVER',score+' points · Big Lug still owns the shop.','Retry shift ▶');return}inv=96;if(fall){p.x=checkpoint||55;p.y=floor;p.v=0;p.ground=true;bolts=[]}else burst(p.x,p.y-18)}
function update(){tick++;if(inv)inv--;if(toast)toast--;if(fireWait)fireWait--;
const dx=Number(down('right'))-Number(down('left'));if(dx)p.face=dx;p.x=Math.max(14,Math.min(end-12,p.x+dx*2.45));if(jumpQueued&&p.ground)p.v=-7.25;jumpQueued=false;const old=p.y;p.v+=.31;p.y+=p.v;p.ground=false;
const surfaces=ledges.filter(([x,y,w])=>p.x+6>x&&p.x-6<x+w).map(a=>a[1]);if(!pits.some(([a,b])=>p.x>a&&p.x<b))surfaces.push(floor);
for(const y of surfaces.sort((a,b)=>a-b)){if(p.v>=0&&old<=y&&p.y>=y){p.y=y;p.v=0;p.ground=true;break}}
if(p.y>H+35){hit(true);if(mode!=='play')return}if(!checkpoint&&p.x>=1380){checkpoint=1380;toast=140}
cam=Math.max(0,Math.min(end-W,p.x-176));
if(down('fire')&&!fireWait){bolts.push({x:p.x+p.face*13,y:p.y-17,v:p.face*6.5,friend:true});fireWait=10}
for(const e of enemies){if(!e.hp||Math.abs(e.x-p.x)>W)continue;e.flash=Math.max(0,e.flash-1);e.x=e.base+Math.sin(tick*.025+e.phase)*(e.boss?45:26);if(e.boss)e.y=floor-32*Math.max(0,Math.sin(tick*.039));if(--e.shot<=0){e.shot=e.boss?56:155;bolts.push({x:e.x,y:e.y-e.r,v:Math.sign(p.x-e.x||1)*(e.boss?2.8:1.9),friend:false})}
if(Math.abs(p.x-e.x)<e.r+8&&p.y>e.y-e.r*2&&p.y-31<e.y)hit();if(mode!=='play')return}
for(const b of bolts){b.x+=b.v;if(b.friend){const e=enemies.find(e=>e.hp&&Math.abs(b.x-e.x)<e.r+3&&Math.abs(b.y-e.y+e.r)<e.r+2);if(e){b.dead=true;e.flash=6;burst(b.x,b.y);if(--e.hp===0){score+=e.boss?2000:150;if(e.boss){screen('won','BAY CLEAR!',score+' points · Big Lug is scrap.','Play again ▶');return}}}}else if(Math.abs(b.x-p.x)<9&&b.y<p.y&&b.y>p.y-32){b.dead=true;hit();if(mode!=='play')return}}
bolts=bolts.filter(b=>!b.dead&&b.x>cam-35&&b.x<cam+W+35);sparks=sparks.filter(s=>s.life-->0);for(const s of sparks){s.x+=s.vx;s.y+=s.vy;s.vy+=.15}}
function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)}
function label(str,x,y,c,size=10){g.fillStyle=c;g.font='bold '+size+'px monospace';g.fillText(str,x,y)}
function tire(x,y,r,phase,flash=false){g.save();g.translate(Math.round(x),Math.round(y));g.rotate(phase);for(let i=0;i<12;i++){g.rotate(Math.PI/6);rect(-r*.32,-r,r*.64,r*.42,flash?'#ffe6a1':'#4b6266')}for(const [scale,col] of [[.92,'#151d23'],[.60,'#677878'],[.40,'#213238'],[.17,'#de9c4a']]){g.fillStyle=flash?'#fff1b0':col;g.beginPath();g.arc(0,0,r*scale,0,Math.PI*2);g.fill()}g.restore()}
function render(){g.imageSmoothingEnabled=false;rect(0,0,W,H,'#192c38');
for(let i=-1;i<6;i++){const x=i*144-(cam*.30%144);rect(x,41,138,122,'#284754');rect(x+9,51,119,42,'#527275');for(let k=0;k<6;k++)rect(x+10+k*21,51,3,43,'#263c45');rect(x+8,70,121,3,'#263c45');rect(x+14,111,108,64,'#243b46');for(let y=114;y<173;y+=7)rect(x+14,y,108,2,'#314c54');rect(x,13,5,181,'#17262d');rect(x+46,33,48,3,'#ffe1a1')}
for(let i=0;i<15;i++){const x=i*220-cam*.72;if(x< -190||x>W)continue;rect(x,100,6,98,'#885e47');rect(x+96,100,6,98,'#885e47');rect(x,152,102,4,'#da9b56');rect(x+10,135,77,11,'#53666a');rect(x+26,128,37,9,'#53666a');tire(x+24,147,6,0);tire(x+75,147,6,0);label('BAY '+String(i+1).padStart(2,'0'),x+14,108,'#8ba9a4')}
rect(0,198,W,42,'#344950');for(let x=-(cam%30);x<W;x+=30)rect(x,214,18,2,'#546367');
for(const [a,b] of pits){rect(a-cam,198,b-a,42,'#0a151c');rect(a-cam,230,b-a,3,'#923f36')}
for(const [x,y,w] of ledges){rect(x-cam,y,w,7,'#e2ac56');for(let i=3;i<w-6;i+=14)rect(x-cam+i,y,6,7,'#34434a');rect(x-cam,y+7,w,4,'#19272c')}
rect(1370-cam,167,4,38,'#c8d2bd');rect(1374-cam,167,22,12,checkpoint?'#71e2ad':'#dba955');
for(const e of enemies){if(!e.hp||e.x<cam-40||e.x>cam+W+40)continue;tire(e.x-cam,e.y-e.r,e.r,tick*.045,e.flash);rect(e.x-cam-e.r*.45,e.y-e.r-3,e.r*.9,4,'#ff7157');if(e.boss){label('BIG LUG',e.x-cam-23,e.y-2*e.r-12,'#ffdca3');rect(e.x-cam-22,e.y-2*e.r-8,44,3,'#312d30');rect(e.x-cam-22,e.y-2*e.r-8,e.hp*2,3,'#ff845b')}}
if(art.complete&&art.naturalWidth&&(!inv||Math.floor(inv/5)%2===0)){g.save();g.translate(Math.round(p.x-cam),Math.round(p.y));g.scale(p.face,1);const bob=p.ground&&(down('left')||down('right'))?Math.round(Math.sin(tick*.55)*1.6):0;g.drawImage(art,-14,-40+bob,28,40);if(fireWait>7)rect(13,-19,8,4,'#ffe591');g.restore()}
for(const b of bolts)rect(b.x-cam-3,b.y-2,b.friend?9:6,4,b.friend?'#ffdc78':'#ff7365');for(const s of sparks)rect(s.x-cam,s.y,2,2,'#ffbf65');
